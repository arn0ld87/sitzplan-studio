name: Gate

# Das Gate aus docs/runbooks/pre-push-gate.md, erzwungen bei jedem Pull Request
# gegen main. Vier Schritte in fester Reihenfolge, Abbruch beim ersten Fehler.

on:
  pull_request:
    branches: [main]

# Ein laufendes Gate pro Branch reicht. Ein neuer Push macht den alten Lauf wertlos.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Bun einrichten
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Bun-Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Abhaengigkeiten installieren
        run: bun install --frozen-lockfile

      # Ab hier die vier Schritte des Runbooks, jeder als eigener Step.
      # Faellt einer, steht der Name direkt in der Job-Uebersicht.
      - name: Schritt 1 von 4 — typecheck
        run: bun run typecheck

      - name: Schritt 2 von 4 — lint
        run: bun run lint

      - name: Schritt 3 von 4 — test
        run: bun run test

      - name: Schritt 4 von 4 — build
        run: bun run build
