name: Gate

# Das Gate aus docs/runbooks/pre-push-gate.md, erzwungen bei jedem Pull Request
# gegen main. Vier Schritte in fester Reihenfolge, Abbruch beim ersten Fehler.

on:
  pull_request:
    branches: [main]

# Ein laufendes Gate pro Branch reicht. Ein neuer Push macht den alten Lauf wertlos.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Bun einrichten
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Bun-Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Abhaengigkeiten installieren
        run: bun install --frozen-lockfile

      # Ab hier die vier Schritte des Runbooks, jeder als eigener Step.
      # Faellt einer, steht der Name direkt in der Job-Uebersicht.
      - name: Schritt 1 von 4 — typecheck
        run: bun run typecheck

      - name: Schritt 2 von 4 — lint
        run: bun run lint

      # Schritt 3 misst zugleich die Abdeckung. Ein zweiter Testlauf nur fuer
      # die Zahl waere verschwendete Laufzeit. `shell: bash` setzt pipefail —
      # ohne das wuerde `tee` einen roten Testlauf verschlucken.
      - name: Schritt 3 von 4 — test
        shell: bash
        run: bun run test:coverage 2>&1 | tee coverage-lauf.txt

      - name: Schritt 4 von 4 — build
        run: bun run build

      # Die Zahl gehoert dorthin, wo sie jemand sieht, ohne ins Log zu steigen.
      # Bewusst ohne Schwelle: Eine harte Grenze wuerde jetzt zu Tests
      # verleiten, die Zeilen abdecken statt Verhalten zu pruefen. Die Schwelle
      # kommt als eigenes Issue, wenn die Tests aus #4 bis #6 stehen.
      - name: Abdeckung in die Job-Zusammenfassung schreiben
        if: always()
        shell: bash
        run: |
          {
            echo "## Testabdeckung"
            echo
            # Auf die Tabellenmarke pruefen, nicht auf die Datei: tee legt sie
            # sofort an, auch wenn vitest gleich beim Start faellt. Ein Test auf
            # -f waere immer wahr und wuerde eine leere Tabelle als Messung
            # ausgeben.
            if grep -q "% Coverage report" coverage-lauf.txt 2>/dev/null; then
              echo '```'
              # Nur die Abdeckungstabelle, nicht der ganze Testlauf.
              sed -n '/% Coverage report/,$p' coverage-lauf.txt
              echo '```'
              echo
              echo "Gemessen wird die Domaenenlogik: \`src/data\`, \`src/lib\`, \`src/components/ui-kit\`."
              echo "Routen und generierte Dateien bleiben aussen vor — sie verzerren die Quote,"
              echo "ohne etwas ueber die Qualitaet auszusagen (siehe \`vitest.config.ts\`)."
              echo
              echo "Keine Schwelle: Die Abdeckung ist im Aufbau. Ein roter Build wegen einer"
              echo "Prozentzahl kaeme zu frueh."
            else
              echo "Kein Abdeckungsbericht vorhanden — der Testschritt ist vermutlich vorher gefallen."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Abdeckungsbericht als Artefakt ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abdeckung
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
